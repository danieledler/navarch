[package]
name = "navarch"
version = "0.1.0"
description = "Navarch planner"
edition = "2021"
rust-version = "1.95"
resolver = "3"

[lib]
name = "navarch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = "0.40"
ureq = "3.5"
chrono = "0.4"
dirs = "6"
memchr = "2"

# Already in the tree through sysinfo and Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
# Reads detached session jobs' environment (procs.rs).
libc = "0.2"
# Dev builds recolour the Dock icon (lib.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Optimize dependencies in dev builds: the first transcript parse is serde-heavy.
[profile.dev.package."*"]
opt-level = 2
